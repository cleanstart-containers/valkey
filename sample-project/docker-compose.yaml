services:

  valkey:
    image: cleanstart/valkey:latest-dev
    container_name: valkey-server
    ports:
      - "6379:6379"
    volumes:
      - ./valkey.conf:/usr/local/etc/valkey/valkey.conf:ro
      - valkey-data:/data
    command: /usr/local/etc/valkey/valkey.conf
    restart: unless-stopped

volumes:
  valkey-data: